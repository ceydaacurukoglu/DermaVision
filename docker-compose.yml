services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: derma
      POSTGRES_PASSWORD: ${DB_PASSWORD:-degistir_beni} 
      POSTGRES_DB: dermavision
    volumes:
      - pg_veri:/var/lib/postgresql/data    # veritabanı dosyaları (konteyner silinse de kalır)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U derma -d dermavision"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy            # veritabanı hazır olmadan API başlamaz
    env_file:
      - .env
    environment:
      DERMA_VERI_DIZINI: /data                # yüklenen fotoğraflar
      DERMA_MODEL_DIZINI: /model              # yapay zekâ model dosyaları
      DATABASE_URL: postgresql+psycopg://derma:${DB_PASSWORD:-degistir_beni}@db:5432/dermavision
    volumes:
      - derma_veri:/data                      # fotoğraflar (konteyner silinse de kalır)
      - ./model:/model:ro                     # model dosyaları
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/saglik')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pg_veri:
  derma_veri:
